[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonefmt"
version = "0.1.0"
description = "Parse, validate, and format phone numbers with no third-party dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "bnorton92" }]

[tool.setuptools.packages.find]
where = ["src"]
